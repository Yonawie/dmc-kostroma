<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Галерея Детского морского центра города Костромы.">
  <title>Галерея — Детский морской центр Костромы</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div data-header></div>

  <main id="main">
    <div class="page-hero">
      <div class="container">
        <h1>Галерея</h1>
        <p>Практика, модели, спорт и праздники центра</p>
      </div>
    </div>

    <section>
      <div class="container">
        <div class="filters">
          <button class="filter is-on" type="button" data-filter="all">Все</button>
          <button class="filter" type="button" data-filter="sea">Море</button>
          <button class="filter" type="button" data-filter="practice">Практика</button>
          <button class="filter" type="button" data-filter="sport">Спорт</button>
          <button class="filter" type="button" data-filter="art">Творчество</button>
        </div>
        <div class="gallery">
          <button type="button" class="shot shot-a" data-cat="sea" data-caption="Занятие по морскому делу: компас, карта и вахтенный журнал."><span>Урок навигации</span></button>
          <button type="button" class="shot shot-b" data-cat="practice" data-caption="Учебный теплоход «Вихрь-46» на Волге."><span>«Вихрь-46»</span></button>
          <button type="button" class="shot shot-c" data-cat="practice" data-caption="Плавпрактика на теплоходе «Прибой-94»."><span>«Прибой-94»</span></button>
          <button type="button" class="shot shot-d" data-cat="sea" data-caption="Морское многоборье: узлы и флажный семафор."><span>Многоборье</span></button>
          <button type="button" class="shot shot-e" data-cat="sea" data-caption="Мастерская судомоделирования: сборка корпуса."><span>Модели</span></button>
          <button type="button" class="shot shot-h" data-cat="practice" data-caption="Швартовка и работа на палубе во время практики."><span>Швартовка</span></button>
          <button type="button" class="shot shot-f" data-cat="sport" data-caption="Занятия айкидо в спортивном зале центра."><span>Айкидо</span></button>
          <button type="button" class="shot shot-g" data-cat="sport" data-caption="Академия ушу: показательные выступления."><span>Ушу</span></button>
          <button type="button" class="shot shot-i" data-cat="art" data-caption="Отчётный концерт вокальной студии."><span>Вокал</span></button>
          <button type="button" class="shot shot-j" data-cat="art" data-caption="Хореография: репетиция к городскому концерту."><span>Хореография</span></button>
          <button type="button" class="shot shot-k" data-cat="practice" data-caption="Летняя смена «Морской бриз» на берегу Волги."><span>Летняя смена</span></button>
          <button type="button" class="shot shot-l" data-cat="sea" data-caption="День открытых дверей для семей Костромы."><span>День открытых дверей</span></button>
        </div>
        <p class="center mt muted muted--sm">Снимки можно заменить на фото из архива центра — карточки уже готовы к подстановке файлов.</p>
      </div>
    </section>

    <div class="lightbox" role="dialog" aria-modal="true" aria-label="Просмотр фото" aria-hidden="true">
      <div class="lightbox__card">
        <button class="lightbox__close" type="button" data-lb-close aria-label="Закрыть">✕</button>
        <div class="lightbox__visual shot-a" data-lb-visual></div>
        <p data-lb-text></p>
      </div>
    </div>
  </main>

  <div data-footer></div>
  <script src="js/main.js"></script>
</body>
</html>
